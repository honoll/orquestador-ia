<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orquestador IA offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f;
      --panel: #151923;
      --panel-strong: #1f2430;
      --text: #f8fafc;
      --muted: #a7b0c0;
      --line: #2d3444;
      --accent: #6366f1;
      --accent-2: #22d3ee;
      --success: #34d399;
      --shadow: rgba(34, 211, 238, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px 16px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.12), transparent 30rem),
        linear-gradient(135deg, #0f0f0f 0%, #111827 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(26px, 5vw, 44px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(14px);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border: 1px solid rgba(34, 211, 238, 0.34);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(34, 211, 238, 0.1));
      box-shadow: 0 0 36px var(--shadow);
      font-size: 46px;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 6vw, 3.75rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 560px;
      margin: 18px auto 30px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      line-height: 1.6;
    }

    .steps {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: step;
    }

    .step {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(21, 25, 35, 0.86);
    }

    .step::before {
      counter-increment: step;
      content: counter(step);
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 800;
      box-shadow: 0 0 22px rgba(99, 102, 241, 0.28);
    }

    .step-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .command-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: stretch;
      min-width: 0;
    }

    code {
      display: block;
      min-width: 0;
      padding: 13px 14px;
      overflow-x: auto;
      border: 1px solid rgba(99, 102, 241, 0.22);
      border-radius: 10px;
      background: #0b1020;
      color: #dbeafe;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: nowrap;
    }

    code::after {
      content: "";
      display: inline-block;
      width: 0.55em;
      height: 1em;
      margin-left: 6px;
      border-right: 2px solid var(--accent-2);
      vertical-align: -0.15em;
      animation: blink 1.1s steps(1, end) infinite;
    }

    button {
      min-width: 96px;
      border: 1px solid rgba(34, 211, 238, 0.36);
      border-radius: 10px;
      background: rgba(34, 211, 238, 0.1);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    button:hover {
      border-color: rgba(34, 211, 238, 0.72);
      background: rgba(34, 211, 238, 0.18);
      transform: translateY(-1px);
    }

    button.copied {
      border-color: rgba(52, 211, 153, 0.6);
      color: var(--success);
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.98rem;
    }

    @keyframes pulse-glow {
      0%,
      100% {
        box-shadow: 0 0 28px rgba(34, 211, 238, 0.16), 0 0 0 rgba(99, 102, 241, 0);
        transform: translateY(0);
      }

      50% {
        box-shadow: 0 0 44px rgba(34, 211, 238, 0.32), 0 0 28px rgba(99, 102, 241, 0.24);
        transform: translateY(-2px);
      }
    }

    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 16px 12px;
      }

      main {
        border-radius: 14px;
      }

      .step {
        grid-template-columns: 1fr;
      }

      .step::before {
        width: 32px;
        height: 32px;
      }

      .command-row {
        grid-template-columns: 1fr;
      }

      button {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⚡</div>
    <h1>Orquestador IA está apagado</h1>
    <p class="subtitle">El servidor no está corriendo. Sigue estos pasos para iniciarlo:</p>

    <ol class="steps">
      <li class="step">
        <p class="step-title">Abre una terminal</p>
      </li>
      <li class="step">
        <div class="command-row">
          <code>cd C:\estudio\orquestador-ia</code>
          <button type="button" data-copy="cd C:\estudio\orquestador-ia">Copiar</button>
        </div>
      </li>
      <li class="step">
        <div class="command-row">
          <code>npm start</code>
          <button type="button" data-copy="npm start">Copiar</button>
        </div>
      </li>
    </ol>

    <footer>Luego recarga esta página</footer>
  </main>

  <script>
    const buttons = document.querySelectorAll("[data-copy]");

    buttons.forEach((button) => {
      button.addEventListener("click", async () => {
        const originalText = button.textContent;

        try {
          await navigator.clipboard.writeText(button.dataset.copy);
          button.textContent = "✓ Copiado!";
          button.classList.add("copied");
          window.setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove("copied");
          }, 2000);
        } catch {
          button.textContent = "Error";
          window.setTimeout(() => {
            button.textContent = originalText;
          }, 2000);
        }
      });
    });
  </script>
</body>
</html>
